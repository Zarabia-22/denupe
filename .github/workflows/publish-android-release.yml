name: Publicar APK Android v1.4.8

on:
  push:
    branches:
      - release/v1.4.8

permissions:
  contents: write

concurrency:
  group: denupe-release-v1.4.8
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Compilar y publicar APK
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar configuración de la aplicación
        env:
          INSFORGE_URL: ${{ vars.INSFORGE_URL || 'https://sbb8pb43.us-east.insforge.app' }}
          INSFORGE_ANON_KEY: ${{ secrets.INSFORGE_ANON_KEY }}
          DENUPE_IA_URL: ${{ vars.DENUPE_IA_URL || 'https://denupe-ia-backend-hu-ia02-test.onrender.com' }}
        run: |
          if [ -z "$INSFORGE_ANON_KEY" ]; then
            echo "::error::Falta configurar el secreto INSFORGE_ANON_KEY en GitHub Actions."
            exit 1
          fi
          cat > .env <<EOF
          INSFORGE_URL=$INSFORGE_URL
          INSFORGE_ANON_KEY=$INSFORGE_ANON_KEY
          DENUPE_IA_URL=$DENUPE_IA_URL
          EOF

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze --no-fatal-infos

      - name: Ejecutar pruebas
        run: flutter test

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Preparar APK y checksum
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk denupe-1.4.8.apk
          sha256sum denupe-1.4.8.apk > denupe-1.4.8.apk.sha256

      - name: Publicar GitHub Release v1.4.8
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.8
          target_commitish: ${{ github.sha }}
          name: DenuPe 1.4.8 (PMV 2)
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            ## DenuPe 1.4.8 — PMV 2

            Esta versión mejora la presentación del selector territorial con tarjetas minimalistas y etiquetas vinculadas directamente al distrito. Cuando el catálogo no identifica una institución pública concreta, la interfaz muestra «Atención territorial en [distrito]» en lugar de expresiones genéricas.

            ### Novedades
            - Presenta las ocho opciones territoriales en tarjetas minimalistas, priorizando el nombre del organismo o canal de atención sobre el nombre de la categoría.
            - Muestra el distrito como información secundaria y resalta visualmente la opción seleccionada.
            - Sustituye etiquetas genéricas como «Entidad competente» o «Entidad por identificar» por «Atención territorial en [distrito]» cuando no existe un nombre institucional concreto verificado.
            - Conserva los nombres reales de instituciones cuando el catálogo sí los proporciona.
            - Guarda la ruta territorial elegida separada del identificador de una institución pública concreta.
            - Mantiene la sugerencia de entidad mediante IA como alternativa cuando el ciudadano no tiene certeza sobre qué opción elegir.
            - La recomendación de entidad mediante IA solo se solicita al pulsar **Sugerir entidad**.
            - Mantiene la selección manual como decisión del ciudadano.
            - El backend determina el distrito a partir de las coordenadas recibidas y evita confiar en el distrito enviado por el cliente.
            - Se abstiene de inventar instituciones cuando no existe una entidad concreta verificable en las fuentes disponibles.

            ### Alcance y limitaciones
            El catálogo territorial ofrece rutas de atención por categoría; no todas representan una institución pública concreta verificada ni una cobertura institucional completa de todos los distritos del Perú. La migración `migrations/20261123010000_ruta_territorial_denuncia.sql` debe estar aplicada en InsForge para persistir la selección manual. La bandeja de revisión de competencia es interna de DenuPe y no es una entidad pública.

            ### Configuración del APK
            El APK se compila en modo release. La configuración Android actual utiliza la firma de depuración para este tipo de compilación, por lo que está destinado a instalación directa y pruebas; antes de distribuirlo mediante Google Play se debe configurar una clave de firma de producción.
          files: |
            denupe-1.4.8.apk
            denupe-1.4.8.apk.sha256
          fail_on_unmatched_files: true
