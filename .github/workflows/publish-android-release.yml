name: Publicar APK Android

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: denupe-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Compilar y publicar APK
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar configuración del backend
        env:
          DENUPE_API_URL: ${{ vars.DENUPE_API_URL || 'https://denupe-backend.onrender.com' }}
        run: |
          cat > .env <<EOF
          DENUPE_API_URL=$DENUPE_API_URL
          EOF

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze --no-fatal-infos

      - name: Ejecutar pruebas
        run: flutter test

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Preparar APK y checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "denupe-${RELEASE_TAG}.apk"
          sha256sum "denupe-${RELEASE_TAG}.apk" > "denupe-${RELEASE_TAG}.apk.sha256"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: DenuPe ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            denupe-${{ github.ref_name }}.apk
            denupe-${{ github.ref_name }}.apk.sha256
