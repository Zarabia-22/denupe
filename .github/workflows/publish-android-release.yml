name: Publicar APK Android v1.5.0

on:
  push:
    branches:
      - release/v1.5.0

permissions:
  contents: write

concurrency:
  group: denupe-release-v1.5.0
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Compilar y publicar APK
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar configuración de la aplicación
        env:
          INSFORGE_URL: ${{ vars.INSFORGE_URL || 'https://sbb8pb43.us-east.insforge.app' }}
          INSFORGE_ANON_KEY: ${{ secrets.INSFORGE_ANON_KEY }}
          DENUPE_IA_URL: ${{ vars.DENUPE_IA_URL || 'https://denupe-ia-backend-hu-ia02-test.onrender.com' }}
        run: |
          if [ -z "$INSFORGE_ANON_KEY" ]; then
            echo "::error::Falta configurar el secreto INSFORGE_ANON_KEY en GitHub Actions."
            exit 1
          fi
          cat > .env <<EOF
          INSFORGE_URL=$INSFORGE_URL
          INSFORGE_ANON_KEY=$INSFORGE_ANON_KEY
          DENUPE_IA_URL=$DENUPE_IA_URL
          EOF

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze --no-fatal-infos

      - name: Ejecutar pruebas
        run: flutter test

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Preparar APK y checksum
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk denupe-1.5.0.apk
          sha256sum denupe-1.5.0.apk > denupe-1.5.0.apk.sha256

      - name: Publicar GitHub Release v1.5.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          target_commitish: ${{ github.sha }}
          name: DenuPe 1.5.0 (PMV 2)
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            ## DenuPe 1.5.0 — PMV 2

            Esta versión incorpora recuperación de contraseña por correo y deja lista la infraestructura para notificaciones por SMS, conservando el selector territorial y la recomendación de entidad de las versiones anteriores.

            ### Novedades
            - Recuperación de contraseña por correo: código de verificación, reenvío y cambio de contraseña desde la pantalla de acceso.
            - Registro de solicitudes de recuperación en InsForge para seguimiento posterior.
            - Corrección de las plantillas de correo para usar la variable real `{{ token }}` en los códigos de verificación y reseteo.
            - Infraestructura idempotente de SMS para notificaciones: cola de pendientes, reintentos, marcas de envío y normalización de teléfonos peruanos.
            - Edge function `send-notification-sms` y schedule `sms-notificaciones` desplegados; el schedule permanece inactivo hasta configurar los secretos del proveedor.

            ### Alcance y limitaciones
            El envío de SMS requiere configurar `TWILIO_ACCOUNT_SID`, `TWILIO_AUTH_TOKEN` y `TWILIO_FROM_NUMBER` (o `TWILIO_MESSAGING_SERVICE_SID`), y activar el schedule. Los perfiles sin teléfono válido de 9 dígitos se omiten con `TELEFONO_INVALIDO`. Las migraciones `20261124000000_recovery-email-requests.sql` y `20261124020000_notificaciones-sms.sql` deben estar aplicadas en InsForge. La bandeja de revisión de competencia es interna de DenuPe y no es una entidad pública.

            ### Configuración del APK
            El APK se compila en modo release. La configuración Android actual utiliza la firma de depuración para este tipo de compilación, por lo que está destinado a instalación directa y pruebas; antes de distribuirlo mediante Google Play se debe configurar una clave de firma de producción.
          files: |
            denupe-1.5.0.apk
            denupe-1.5.0.apk.sha256
          fail_on_unmatched_files: true
