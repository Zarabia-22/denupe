name: Publicar APK Android

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: denupe-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Compilar y publicar APK
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validar versión del tag y secretos de firma
        id: validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          package_version=$(grep -E '^version:[[:space:]]*' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/[[:space:]]+$//' | head -n 1)
          package_version=${package_version%%+*}
          expected_tag="v${package_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::El tag $RELEASE_TAG no coincide con la versión de pubspec.yaml ($package_version). El tag esperado es $expected_tag."
            exit 1
          fi
          missing=()
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              missing+=("$secret_name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Faltan secretos de firma Android: ${missing[*]}. Configúralos en el repositorio antes de publicar."
            exit 1
          fi
          echo "version_match=true" >> "$GITHUB_OUTPUT"

      - name: Preparar configuración del backend
        env:
          DENUPE_API_URL: ${{ vars.DENUPE_API_URL || 'https://denupe-backend.onrender.com' }}
        run: |
          cat > .env <<EOF
          DENUPE_API_URL=$DENUPE_API_URL
          EOF

      - name: Configurar firma de release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          printf 'storeFile=app/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        # Mantiene el mismo criterio que Flutter CI: infos no bloquean el release.
        run: flutter analyze --no-fatal-infos

      - name: Ejecutar pruebas
        run: flutter test --coverage

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Preparar APK y checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "denupe-${RELEASE_TAG}.apk"
          sha256sum "denupe-${RELEASE_TAG}.apk" > "denupe-${RELEASE_TAG}.apk.sha256"

      - name: Publicar GitHub Release
        if: steps.validate.outputs.version_match == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: DenuPe ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: ${{ steps.validate.outputs.version_match }}
          generate_release_notes: true
          files: |
            denupe-${{ github.ref_name }}.apk
            denupe-${{ github.ref_name }}.apk.sha256
