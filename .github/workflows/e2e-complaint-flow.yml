name: DenuPe - E2E denuncia + IA + reglas de negocio

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL base del backend (sin /api/v1)"
        required: false
        default: "https://denupe-backend.onrender.com"
        type: string
      latitude:
        description: "Latitud para las pruebas territoriales"
        required: false
        default: "-12.0464"
        type: string
      longitude:
        description: "Longitud para las pruebas territoriales"
        required: false
        default: "-77.0428"
        type: string

permissions:
  contents: read

concurrency:
  group: denupe-e2e-complaint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-complaint:
    name: Flujo completo de denuncia y validación de reglas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade requests
      - name: Validate required secrets
        env:
          DENUPE_TEST_EMAIL: ${{ secrets.DENUPE_TEST_EMAIL }}
          DENUPE_TEST_PASSWORD: ${{ secrets.DENUPE_TEST_PASSWORD }}
        run: |
          test -n "$DENUPE_TEST_EMAIL" || (echo "::error::Falta el secreto DENUPE_TEST_EMAIL" && exit 1)
          test -n "$DENUPE_TEST_PASSWORD" || (echo "::error::Falta el secreto DENUPE_TEST_PASSWORD" && exit 1)
      - name: Execute end-to-end complaint flow
        env:
          DENUPE_API_URL: ${{ inputs.api_url }}
          DENUPE_TEST_EMAIL: ${{ secrets.DENUPE_TEST_EMAIL }}
          DENUPE_TEST_PASSWORD: ${{ secrets.DENUPE_TEST_PASSWORD }}
          DENUPE_TEST_SECOND_EMAIL: ${{ secrets.DENUPE_TEST_SECOND_EMAIL }}
          DENUPE_TEST_SECOND_PASSWORD: ${{ secrets.DENUPE_TEST_SECOND_PASSWORD }}
          DENUPE_TEST_LATITUDE: ${{ inputs.latitude }}
          DENUPE_TEST_LONGITUDE: ${{ inputs.longitude }}
        run: python scripts/e2e_complaint_flow.py
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: denupe-e2e-complaint-report
          path: e2e-report.json
          if-no-files-found: warn
          retention-days: 30
