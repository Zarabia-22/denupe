name: Flutter CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main, develop, 'fix/**', 'release/**']

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare environment file for Flutter assets
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Los avisos informativos del SDK Flutter no deben bloquear CI.
        # Los errores y warnings siguen siendo fallos.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Build web release
        run: flutter build web --release

      - name: Build Android debug APK
        run: flutter build apk --debug
